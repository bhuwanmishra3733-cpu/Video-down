name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/vidsafe app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VidSafe"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.vidsafe"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.vidsafe"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
          }
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VidSafe" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="VidSafe"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.VidSafe">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".BrowserActivity" android:exported="false" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/example/vidsafe/Downloader.kt <<'EOF'
          package com.example.vidsafe

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.ConcurrentHashMap

          /** Downloads direct video files and plain (unencrypted) HLS streams into app-private storage. */
          object Downloader {
              private class H(val ua: String?, val ref: String?, val cookie: String?)

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val main = Handler(Looper.getMainLooper())

              /** file name -> percent */
              val active = ConcurrentHashMap<String, Int>()
              @Volatile var onUpdate: (() -> Unit)? = null

              /** Private folder: not visible in gallery or file managers. */
              fun dir(ctx: Context) = File(ctx.filesDir, "videos").apply { mkdirs() }

              private fun toast(ctx: Context, msg: String) =
                  main.post { Toast.makeText(ctx, msg, Toast.LENGTH_LONG).show() }

              private fun changed() { main.post { onUpdate?.invoke() } }

              fun start(ctx: Context, url: String, userAgent: String? = null, referer: String? = null, cookie: String? = null) {
                  val app = ctx.applicationContext
                  val hls = url.substringBefore('?').lowercase().endsWith(".m3u8")
                  val name = makeName(url, hls)
                  val part = File(dir(app), "$name.part")
                  scope.launch {
                      try {
                          active[name] = 0; changed()
                          toast(app, "Download shuru: $name")
                          val h = H(userAgent, referer, cookie)
                          if (hls) hls(url, part, name, h) else direct(url, part, name, h)
                          part.renameTo(File(dir(app), name))
                          toast(app, "Ho gaya: $name")
                      } catch (e: Exception) {
                          part.delete()
                          toast(app, "Fail: ${e.message}")
                      } finally {
                          active.remove(name); changed()
                      }
                  }
              }

              private fun open(url: String, h: H): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.setRequestProperty("User-Agent", h.ua ?: "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36")
                  h.ref?.let { c.setRequestProperty("Referer", it) }
                  h.cookie?.let { c.setRequestProperty("Cookie", it) }
                  if (c.responseCode !in 200..299) throw Exception("Server error ${c.responseCode}")
                  return c
              }

              private fun direct(url: String, part: File, name: String, h: H) {
                  val c = open(url, h)
                  val total = c.contentLengthLong
                  c.inputStream.use { input ->
                      FileOutputStream(part).use { out ->
                          val buf = ByteArray(64 * 1024)
                          var done = 0L
                          var last = -1
                          while (true) {
                              val n = input.read(buf)
                              if (n <= 0) break
                              out.write(buf, 0, n)
                              done += n
                              if (total > 0) {
                                  val p = (done * 100 / total).toInt()
                                  if (p != last) { last = p; active[name] = p; changed() }
                              }
                          }
                      }
                  }
              }

              private fun text(url: String, h: H) = open(url, h).inputStream.bufferedReader().use { it.readText() }

              private fun hls(url0: String, part: File, name: String, h: H) {
                  var url = url0
                  var pl = text(url, h)
                  if (pl.contains("#EXT-X-STREAM-INF")) { // master playlist -> pick best quality
                      val lines = pl.lines()
                      var best = -1L
                      var uri: String? = null
                      for (i in lines.indices) {
                          if (lines[i].startsWith("#EXT-X-STREAM-INF")) {
                              val bw = Regex("BANDWIDTH=(\\d+)").find(lines[i])?.groupValues?.get(1)?.toLong() ?: 0L
                              val next = lines.drop(i + 1).firstOrNull { it.isNotBlank() && !it.startsWith("#") }
                              if (next != null && bw > best) { best = bw; uri = next.trim() }
                          }
                      }
                      url = URL(URL(url), uri ?: throw Exception("Playlist khali hai")).toString()
                      pl = text(url, h)
                  }
                  if (Regex("#EXT-X-KEY:(?!METHOD=NONE)").containsMatchIn(pl) || pl.contains("#EXT-X-MAP"))
                      throw Exception("Encrypted/protected stream supported nahi hai")
                  val segs = pl.lines().map { it.trim() }
                      .filter { it.isNotEmpty() && !it.startsWith("#") }
                      .map { URL(URL(url), it).toString() }
                  if (segs.isEmpty()) throw Exception("Koi segment nahi mila")
                  FileOutputStream(part).use { out ->
                      segs.forEachIndexed { i, s ->
                          open(s, h).inputStream.use { it.copyTo(out) }
                          active[name] = (i + 1) * 100 / segs.size
                          changed()
                      }
                  }
              }

              private fun makeName(url: String, hls: Boolean): String {
                  val path = url.substringBefore('?')
                  var base = path.substringAfterLast('/').substringBeforeLast('.')
                      .replace(Regex("[^A-Za-z0-9_-]"), "_").take(40)
                  if (base.isBlank() || hls) base = "video"
                  val ext = if (hls) "ts" else path.substringAfterLast('.', "mp4").lowercase()
                      .takeIf { it in listOf("mp4", "webm", "mkv", "mov", "3gp") } ?: "mp4"
                  return "${base}_${System.currentTimeMillis()}.$ext"
              }
          }
          EOF
          
          cat > app/src/main/java/com/example/vidsafe/MainActivity.kt <<'EOF'
          package com.example.vidsafe

          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var list: ListView
              private var files: List<File> = emptyList()
              private var activeCount = 0

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(32), dp(16), dp(16))
                  }
                  root.addView(TextView(this).apply { text = "VidSafe - Private Videos"; textSize = 22f })

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val browse = Button(this).apply { text = "Browser" }
                  val paste = Button(this).apply { text = "Link paste" }
                  row.addView(browse, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(paste, LinearLayout.LayoutParams(0, -2, 1f))
                  root.addView(row)

                  list = ListView(this)
                  root.addView(list, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)

                  browse.setOnClickListener { startActivity(Intent(this, BrowserActivity::class.java)) }
                  paste.setOnClickListener { pasteDialog() }
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val i = pos - activeCount
                      if (i >= 0) startActivity(Intent(this, PlayerActivity::class.java).putExtra("path", files[i].absolutePath))
                  }
                  list.setOnItemLongClickListener { _, _, pos, _ ->
                      val i = pos - activeCount
                      if (i >= 0) AlertDialog.Builder(this)
                          .setMessage("Delete ${files[i].name}?")
                          .setPositiveButton("Delete") { _, _ -> files[i].delete(); refresh() }
                          .setNegativeButton("Cancel", null).show()
                      true
                  }
              }

              private fun pasteDialog() {
                  val et = EditText(this).apply { hint = "https://.../video.mp4 ya .m3u8" }
                  val clip = (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                      .primaryClip?.getItemAt(0)?.text?.toString()
                  if (clip != null && clip.startsWith("http")) et.setText(clip)
                  AlertDialog.Builder(this).setTitle("Video link").setView(et)
                      .setPositiveButton("Download") { _, _ ->
                          val u = et.text.toString().trim()
                          if (u.startsWith("http")) Downloader.start(this, u)
                      }.setNegativeButton("Cancel", null).show()
              }

              override fun onResume() {
                  super.onResume()
                  Downloader.onUpdate = { refresh() }
                  refresh()
              }

              override fun onPause() {
                  super.onPause()
                  Downloader.onUpdate = null
              }

              private fun refresh() {
                  val act = Downloader.active.entries.map { "⬇ ${it.key}   ${it.value}%" }
                  activeCount = act.size
                  files = Downloader.dir(this).listFiles { f -> !f.name.endsWith(".part") }
                      ?.sortedByDescending { it.lastModified() } ?: emptyList()
                  val labels = act + files.map { "${it.name}\n" + String.format("%.1f MB", it.length() / 1048576.0) }
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, labels)
              }
          }
          EOF

          cat > app/src/main/java/com/example/vidsafe/BrowserActivity.kt <<'EOF'
          package com.example.vidsafe

          import android.annotation.SuppressLint
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.view.inputmethod.EditorInfo
          import android.webkit.CookieManager
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity

          class BrowserActivity : AppCompatActivity() {
              private lateinit var web: WebView
              private lateinit var btn: Button
              private lateinit var et: EditText
              private val found = LinkedHashSet<String>()
              private val exts = listOf(".mp4", ".m3u8", ".webm", ".mkv", ".mov")

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, 48, 0, 0) }
                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  et = EditText(this).apply {
                      hint = "URL ya search"; setSingleLine()
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      imeOptions = EditorInfo.IME_ACTION_GO
                  }
                  val go = Button(this).apply { text = "Go" }
                  bar.addView(et, LinearLayout.LayoutParams(0, -2, 1f))
                  bar.addView(go)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          val u = request.url.toString()
                          val p = u.substringBefore('?').lowercase()
                          if (exts.any { p.endsWith(it) }) runOnUiThread {
                              if (found.add(u)) btn.text = "Videos mili: ${found.size} (dekhein)"
                          }
                          return null
                      }
                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          found.clear(); btn.text = "Videos mili: 0"; et.setText(url)
                      }
                  }

                  btn = Button(this).apply { text = "Videos mili: 0" }
                  root.addView(bar)
                  root.addView(web, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(btn)
                  setContentView(root)

                  go.setOnClickListener { load(et.text.toString().trim()) }
                  et.setOnEditorActionListener { _, _, _ -> load(et.text.toString().trim()); true }
                  btn.setOnClickListener { showFound() }
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() { if (web.canGoBack()) web.goBack() else finish() }
                  })
                  load("https://www.google.com")
              }

              private fun load(s: String) {
                  if (s.isEmpty()) return
                  val u = when {
                      s.startsWith("http") -> s
                      s.contains(" ") || !s.contains(".") -> "https://www.google.com/search?q=" + Uri.encode(s)
                      else -> "https://$s"
                  }
                  web.loadUrl(u)
              }

              private fun showFound() {
                  if (found.isEmpty()) {
                      Toast.makeText(this, "Pehle page par video play karo, phir yahan aao", Toast.LENGTH_LONG).show()
                      return
                  }
                  val urls = found.toList()
                  AlertDialog.Builder(this).setTitle("Download karo")
                      .setItems(urls.toTypedArray()) { _, i ->
                          val u = urls[i]
                          Downloader.start(this, u, web.settings.userAgentString, web.url, CookieManager.getInstance().getCookie(u))
                          Toast.makeText(this, "Download list mein dekho (back dabao)", Toast.LENGTH_SHORT).show()
                      }.show()
              }

              override fun onDestroy() { web.destroy(); super.onDestroy() }
          }
          EOF
          
          cat > app/src/main/java/com/example/vidsafe/PlayerActivity.kt <<'EOF'
          package com.example.vidsafe

          import android.net.Uri
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import java.io.File

          class PlayerActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var pv: PlayerView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Blocks screenshots / recent-apps preview. Remove this line if you don't want it.
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  pv = PlayerView(this)
                  setContentView(pv)
              }

              override fun onStart() {
                  super.onStart()
                  val path = intent.getStringExtra("path") ?: run { finish(); return }
                  player = ExoPlayer.Builder(this).build().also {
                      pv.player = it
                      it.setMediaItem(MediaItem.fromUri(Uri.fromFile(File(path))))
                      it.prepare()
                      it.playWhenReady = true
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.release(); player = null
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VidSafe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
